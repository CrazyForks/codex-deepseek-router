<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">codex-deepseek-router</title>
  <desc id="desc">Codex stays the parent agent while tasks route to DeepSeek Flash or Pro and return through a verified native callback.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1D2638" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#7F8CA5"/>
    </marker>
  </defs>
  <rect width="1200" height="400" rx="28" fill="#0A0E17"/>
  <rect width="1200" height="400" rx="28" fill="url(#grid)" opacity="0.36"/>
  <g id="title-block" transform="translate(64 54)">
    <text x="0" y="0" fill="#7F8CA5" font-size="18" font-weight="700" letter-spacing="3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">NATIVE CODEX SUBAGENT ROUTER</text>
    <text x="0" y="78" fill="#F5F7FB" font-size="50" font-weight="750" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">codex-deepseek-router</text>
    <text x="0" y="128" fill="#B9C2D3" font-size="24" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">Keep Codex in control. Route the hard part.</text>
    <g transform="translate(0 178)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="650">
      <rect x="0" y="0" width="208" height="42" rx="8" fill="#121A29" stroke="#33415B"/>
      <circle cx="22" cy="21" r="5" fill="#4ADE80"/><text x="38" y="27" fill="#D7DEEA">PARENT UNCHANGED</text>
      <rect x="224" y="0" width="142" height="42" rx="8" fill="#121A29" stroke="#33415B"/>
      <circle cx="246" cy="21" r="5" fill="#5B8CFF"/><text x="262" y="27" fill="#D7DEEA">2 AGENTS</text>
      <rect x="382" y="0" width="170" height="42" rx="8" fill="#121A29" stroke="#33415B"/>
      <circle cx="404" cy="21" r="5" fill="#A78BFA"/><text x="420" y="27" fill="#D7DEEA">NATIVE PROOF</text>
    </g>
    <text x="0" y="276" fill="#6F7B91" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">stage → spawn → callback → metadata → integrate</text>
  </g>
  <g id="routing-proof" transform="translate(714 42)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <rect x="84" y="0" width="304" height="70" rx="12" fill="#F5F7FB"/>
    <text x="108" y="29" fill="#667085" font-size="17" font-weight="650">PARENT AGENT</text>
    <text x="108" y="55" fill="#101828" font-size="24" font-weight="750">Codex</text><circle cx="354" cy="35" r="9" fill="#4ADE80"/>
    <path d="M236 70V112" stroke="#7F8CA5" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="236" cy="128" r="16" fill="#121A29" stroke="#7F8CA5" stroke-width="2"/>
    <text x="236" y="134" fill="#D7DEEA" text-anchor="middle" font-size="18" font-weight="700">R</text>
    <path d="M220 136L105 184" stroke="#5B8CFF" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M252 136L367 184" stroke="#A78BFA" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="0" y="190" width="218" height="92" rx="12" fill="#111A2B" stroke="#5B8CFF" stroke-width="2"/>
    <text x="22" y="222" fill="#8FB0FF" font-size="18" font-weight="700">DEEPSEEK FLASH</text>
    <text x="22" y="252" fill="#F5F7FB" font-size="22" font-weight="750">fast · read-only</text>
    <rect x="254" y="190" width="218" height="92" rx="12" fill="#181329" stroke="#A78BFA" stroke-width="2"/>
    <text x="276" y="222" fill="#C4B5FD" font-size="18" font-weight="700">DEEPSEEK PRO</text>
    <text x="276" y="252" fill="#F5F7FB" font-size="22" font-weight="750">deep · implement</text>
    <path d="M109 282V318H236" fill="none" stroke="#7F8CA5" stroke-width="3"/>
    <path d="M363 282V318H236V88" fill="none" stroke="#7F8CA5" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="139" y="302" width="194" height="32" rx="16" fill="#10251B" stroke="#2F7A4A"/>
    <text x="236" y="324" fill="#86EFAC" text-anchor="middle" font-size="17" font-weight="700">VERIFIED CALLBACK</text>
  </g>
</svg>
